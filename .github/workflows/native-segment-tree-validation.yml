name: Segment tree native nightly validation
on:
  push:
    branches:
      - codex/native-segment-tree-validation
permissions:
  contents: read
jobs:
  nightly:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 1
      RUST_TEST_THREADS: 1
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
      - name: Install official nightly
        run: rustup toolchain install nightly-2026-10-04 --profile minimal --component clippy,rustfmt --no-self-update
      - name: Record original production with final regression source
        run: |
          rustc +nightly-2026-10-04 --version
          cargo +nightly-2026-10-04 --version
          git rev-parse HEAD
          git hash-object src/data_structures/segment_tree.rs
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object src/data_structures/segment_tree.rs)" = 91e8fb872c7952d09acf3e74fe28c582026763c1
      - name: Segment tree original regressions including terminal errors
        run: cargo +nightly-2026-10-04 test data_structures::segment_tree::tests -- --nocapture
