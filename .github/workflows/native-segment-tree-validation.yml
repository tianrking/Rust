name: Segment tree native nightly validation

on:
  push:
    branches:
      - codex/native-segment-tree-validation

permissions:
  contents: read

jobs:
  nightly:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 1
      RUST_TEST_THREADS: 1
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
      - name: Install official nightly
        run: rustup toolchain install nightly-2026-10-04 --profile minimal --component clippy,rustfmt --no-self-update
      - name: Record native toolchain and source
        run: |
          rustc +nightly-2026-10-04 --version
          cargo +nightly-2026-10-04 --version
          git rev-parse HEAD
          git hash-object src/data_structures/segment_tree.rs
      - name: Segment tree regressions
        run: cargo +nightly-2026-10-04 test data_structures::segment_tree::tests -- --nocapture
      - name: Format
        run: cargo +nightly-2026-10-04 fmt --all -- --check
      - name: Full package tests
        run: cargo +nightly-2026-10-04 test --locked
      - name: Strict Clippy
        run: cargo +nightly-2026-10-04 clippy --locked --all --all-targets -- -D warnings
